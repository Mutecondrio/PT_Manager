<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PT Manager V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6fa;color:#172033}.app{min-height:100vh}.top{height:68px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top button{width:auto;background:#ffffff18;border:1px solid #ffffff33;padding:8px 12px;color:#fff}.layout{display:grid;grid-template-columns:220px 1fr}.side{background:#fff;border-right:1px solid #e5e7eb;min-height:calc(100vh - 68px);padding:18px}.side button{background:none;color:#344054;text-align:left;margin-bottom:6px}.side button.active{background:#eff6ff;color:#175cd3}.side button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.side button{width:100%}main{padding:28px;max-width:1350px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.head button{width:auto}.head h1{margin:0 0 5px}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card,.client{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.stat b{display:block;color:#667085;font-size:13px}.stat strong{font-size:30px;display:block;margin-top:6px}.card{margin-top:18px}.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.client{margin-top:0}.avatar{width:46px;height:46px;border-radius:13px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:900}.ctop{display:flex;gap:10px;align-items:center;justify-content:space-between}.who{display:flex;gap:10px;align-items:center}.name{font-weight:850;font-size:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.gray{background:#f2f4f7;color:#475467}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{width:auto;font-size:13px;padding:8px 10px}.primary{background:#2563eb;color:white}.secondary{background:#eef4ff;color:#175cd3}.danger{background:#fee4e2;color:#b42318}.ghost{background:#fff;color:#344054;border:1px solid #d0d5dd}.empty{text-align:center;padding:36px;color:#667085}.search{width:100%;max-width:450px;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.modal-backdrop{position:fixed;inset:0;background:#10182899;display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 6px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.modal-actions button{width:auto;min-width:110px}.err{margin:12px 0;padding:11px;border-radius:10px;background:#fee4e2;color:#b42318}.ok{margin:12px 0;padding:11px;border-radius:10px;background:#dcfae6;color:#067647}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f6fa}.login{width:min(430px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 12px 40px #0001}.login h1{margin:0 0 8px}.input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}.back{background:#fff;border:1px solid #d0d5dd;color:#344054}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profile-item{padding:14px;background:#f8fafc;border-radius:12px}.profile-item b{display:block;font-size:12px;color:#667085;margin-bottom:4px}.tabs{display:flex;gap:4px;border-bottom:1px solid #e5e7eb;margin-top:20px}.tab{border:0;background:transparent;color:#667085;padding:12px 15px;font-weight:800;border-bottom:3px solid transparent;cursor:pointer}.tab.sel{color:#175cd3;border-bottom-color:#2563eb}.plan-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.exercise{border:1px solid #e5e7eb;border-radius:13px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.exercise strong{display:block;margin-bottom:4px}.exercise small{color:#667085}.history-item{border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.history-title{font-weight:850;font-size:17px}.notice{padding:13px 15px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:12px;margin-bottom:16px;font-weight:700}.day{border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:14px 0;background:#fbfcfe}.day-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.day-title{font-weight:900;font-size:18px}.exercise[draggable="true"]{cursor:grab}.exercise.dragging{opacity:.45;border:2px dashed #2563eb}.exercise.drop-target{border-color:#2563eb;background:#eff6ff}.exercise-actions{display:flex;gap:7px;flex-wrap:wrap}.exercise-actions button{width:auto;padding:7px 9px;font-size:12px}.plan-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:999px;background:#eef4ff;color:#175cd3;font-weight:800;font-size:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{min-height:auto;border-right:0;border-bottom:1px solid #e5e7eb;display:flex;gap:6px;overflow:auto}.side button{width:auto;white-space:nowrap}.stats{grid-template-columns:1fr 1fr}main{padding:18px}.head{align-items:flex-start;flex-direction:column}.modal-grid,.profile-grid{grid-template-columns:1fr}.plan-head,.history-item{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="root"><div class="loginwrap"><div class="login"><h1>PT Manager <span style="color:#2563eb">V2</span></h1><p class="muted">Caricamento…</p></div></div></div>
<script type="module">
const root=document.getElementById('root');
const URL_SUPABASE="https://rzfxqxmwcwxgagjfajbs.supabase.co";
const KEY_SUPABASE="sb_publishable_6Cp0EMJl7cBG_ISCF73L8g_o72RCQTF";
let sb,session,profile,clients=[],currentClient=null,currentPlan=null,exercises=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const initials=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const dateIT=d=>d?new Date(d+"T00:00:00").toLocaleDateString("it-IT"):"—";
function status(p){if(!p)return["gray","Nessuna scheda"];const days=Math.ceil((new Date(p.end_date+"T23:59:59")-new Date())/86400000);if(days<0)return["red","Scaduta"];if(days<=7)return["yellow","Scade tra "+days+" gg"];return["green","Attiva"]}
function showError(m){root.innerHTML=`<div class="loginwrap"><div class="login"><h1>PT Manager V2</h1><div class="err">${esc(m)}</div><button class="btn primary" style="width:100%" onclick="location.reload()">Ricarica</button></div></div>`}
function login(){root.innerHTML=`<div class="loginwrap"><div class="login"><h1>PT Manager <span style="color:#2563eb">V2</span></h1><p class="muted">Accesso area professionista</p><div id="msg"></div><div class="field"><label>Email</label><input id="email" class="input" type="email"></div><div class="field"><label>Password</label><input id="pass" class="input" type="password"></div><button id="loginBtn" class="btn primary" style="width:100%">Accedi</button><p class="muted" style="font-size:12px;margin-top:18px">Versione collegata a Supabase.</p></div></div>`;document.getElementById("loginBtn").onclick=doLogin}
async function doLogin(){const msg=document.getElementById("msg"),btn=document.getElementById("loginBtn");btn.disabled=true;msg.innerHTML="<div class='ok'>Accesso in corso…</div>";const r=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value});if(r.error){msg.innerHTML="<div class='err'>"+esc(r.error.message)+"</div>";btn.disabled=false;return}session=r.data.session;await loadUser();btn.disabled=false}
async function start(){try{const mod=await import("https://esm.sh/@supabase/supabase-js@2");sb=mod.createClient(URL_SUPABASE,KEY_SUPABASE);const r=await sb.auth.getSession();if(r.data.session){session=r.data.session;await loadUser()}else login()}catch(e){showError("Errore di caricamento: "+(e.message||e))}}
async function loadUser(){const r=await sb.from("profiles").select("*").eq("id",session.user.id).single();if(r.error){showError("Profilo non trovato: "+r.error.message);return}profile=r.data;if(profile.role!=="pt"){showError("Questo account non è configurato come PT.");return}await loadClients();dashboard()}
async function loadClients(){const r=await sb.from("clients").select("*,plans(*)").eq("pt_id",session.user.id).order("full_name");if(r.error){showError(r.error.message);return}clients=(r.data||[]).map(c=>({...c,currentPlan:(c.plans||[]).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date))[0]||null}))}
function shell(content,view="dash"){root.innerHTML=`<div class="app"><header class="top"><b>PT Manager <span style="color:#60a5fa">V2</span></b><div>${esc(profile.full_name||session.user.email)} <button id="logout">Esci</button></div></header><div class="layout"><aside><button class="${view==='dash'?'active':''}" id="dashNav">📊 Dashboard</button><button class="${view!=='dash'?'active':''}" id="clientNav">👥 Clienti</button></aside><main id="main">${content}</main></div></div>`;document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById("dashNav").onclick=dashboard;document.getElementById("clientNav").onclick=clientsPage}
function stats(){return `<div class="stats"><div class="stat"><b>CLIENTI</b><strong>${clients.length}</strong></div><div class="stat"><b>SCHEDE ATTIVE</b><strong>${clients.filter(c=>status(c.currentPlan)[0]==="green").length}</strong></div><div class="stat"><b>IN SCADENZA</b><strong>${clients.filter(c=>status(c.currentPlan)[0]==="yellow").length}</strong></div><div class="stat"><b>SCADUTE</b><strong>${clients.filter(c=>status(c.currentPlan)[0]==="red").length}</strong></div></div>`}
function clientCards(list=clients){if(!list.length)return `<div class="card" style="text-align:center;color:#667085">Nessun cliente presente.</div>`;return `<div class="clients">${list.map(c=>{const s=status(c.currentPlan);return `<div class="client"><div class="ctop"><div class="who"><div class="avatar">${esc(initials(c.full_name))}</div><div><div class="name">${esc(c.full_name)}</div><div class="muted">${esc(c.email||"Nessuna email")}</div></div></div><span class="badge ${s[0]}">${esc(s[1])}</span></div><div style="margin:14px 0;font-size:14px"><b>Scheda:</b> ${esc(c.currentPlan?.name||"Nessuna")}<br><b>Periodo:</b> ${c.currentPlan?dateIT(c.currentPlan.start_date)+" → "+dateIT(c.currentPlan.end_date):"—"}</div><div class="actions"><button class="btn secondary" onclick="openClient('${c.id}')">Apri cliente</button><button class="btn ghost" onclick="editClient('${c.id}')">Modifica</button></div></div>`}).join("")}</div>`}
function dashboard(){const attention=clients.filter(c=>["yellow","red"].includes(status(c.currentPlan)[0]));shell(`<div class="head"><div><h1>Dashboard</h1><p class="muted">Panoramica del tuo studio.</p></div><button class="btn primary" id="newClient">+ Nuovo cliente</button></div>${stats()}<div class="card"><h2>Clienti</h2>${attention.length?clientCards(attention):clientCards()}</div>`);document.getElementById("newClient").onclick=newClient}
function clientsPage(){shell(`<div class="head"><div><h1>Clienti</h1><p class="muted">Gestisci i tuoi clienti.</p></div><button class="btn primary" id="newClient">+ Nuovo cliente</button></div><div class="card"><input id="search" class="search" placeholder="Cerca cliente…"><div id="clientList" style="margin-top:16px">${clientCards()}</div></div>`,"clients");document.getElementById("newClient").onclick=newClient;document.getElementById("search").oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById("clientList").innerHTML=clientCards(clients.filter(c=>c.full_name.toLowerCase().includes(q)||(c.email||"").toLowerCase().includes(q)))}}
async function openClient(id){currentClient=clients.find(c=>c.id===id);if(!currentClient)return;currentPlan=currentClient.currentPlan;await loadExercises();clientPage("profile")}
async function loadExercises(){if(!currentPlan){exercises=[];return}const r=await sb.from("plan_exercises").select("*").eq("plan_id",currentPlan.id).order("exercise_order");exercises=r.data||[]}
function clientPage(tab="profile"){if(!currentClient){clientsPage();return}const c=currentClient;const p=currentPlan;const s=status(p);shell(`<div class="detail-head"><button class="btn back" id="back">← Clienti</button><div class="avatar">${esc(initials(c.full_name))}</div><div style="flex:1"><h1 style="margin:0">${esc(c.full_name)}</h1><div class="muted">${esc(c.email||"Nessuna email")}</div></div><button class="btn ghost" id="edit">Modifica cliente</button></div><div class="tabs"><button class="tab ${tab==='profile'?'sel':''}" data-tab="profile">👤 Profilo</button><button class="tab ${tab==='plan'?'sel':''}" data-tab="plan">🏋️ Scheda attuale</button><button class="tab ${tab==='history'?'sel':''}" data-tab="history">📚 Storico</button><button class="tab ${tab==='progress'?'sel':''}" data-tab="progress">📊 Progressi</button></div><div id="detailContent"></div>` ,"clients");document.getElementById("back").onclick=clientsPage;document.getElementById("edit").onclick=()=>editClient(c.id);document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>clientPage(b.dataset.tab));renderClientTab(tab)}
function renderClientTab(tab){const el=document.getElementById("detailContent");if(tab==="profile"){el.innerHTML=`<div class="card"><h2>Profilo</h2><div class="profile-grid"><div class="profile-item"><b>NOME</b>${esc(currentClient.full_name)}</div><div class="profile-item"><b>EMAIL</b>${esc(currentClient.email||"—")}</div><div class="profile-item"><b>TELEFONO</b>${esc(currentClient.phone||"—")}</div><div class="profile-item"><b>STATO</b>${esc(currentClient.status||"Attivo")}</div><div class="profile-item" style="grid-column:1/-1"><b>NOTE</b>${esc(currentClient.notes||"—")}</div></div><div class="actions"><button class="btn primary" onclick="newPlan()">+ Nuova scheda</button></div></div>`;return}if(tab==="plan"){if(!currentPlan){el.innerHTML=`<div class="card empty"><h2>Nessuna scheda attiva</h2><p>Crea la prima scheda di allenamento per ${esc(currentClient.full_name)}.</p><button class="btn primary" onclick="newPlan()">+ Crea scheda</button></div>`;return}const st=status(currentPlan);const groups={};(exercises||[]).forEach(e=>{(groups[e.day_name||"Giorno A"]??=[]).push(e)});const days=Object.keys(groups);el.innerHTML=`<div class="card"><div class="plan-toolbar"><div><h2 style="margin:0">${esc(currentPlan.name)}</h2><p class="muted">${dateIT(currentPlan.start_date)} → ${dateIT(currentPlan.end_date)} · <span class="badge ${st[0]}">${st[1]}</span></p></div><div class="actions" style="margin-top:0"><button class="btn ghost" onclick="editPlan('${currentPlan.id}')">Modifica</button><button class="btn secondary" onclick="duplicatePlan('${currentPlan.id}')">Duplica</button><button class="btn danger" onclick="deletePlan('${currentPlan.id}')">Elimina</button></div></div>${currentPlan.description?`<p class="muted">${esc(currentPlan.description)}</p>`:''}<div class="actions"><button class="btn primary" onclick="newExercise()">+ Aggiungi esercizio</button><span class="pill">${exercises.length} esercizi · ${days.length} giorni</span></div></div><div class="card"><h2>Allenamento</h2>${days.length?days.map(day=>`<div class="day"><div class="day-head"><div class="day-title">${esc(day)}</div><span class="pill">${groups[day].length} esercizi</span></div>${groups[day].sort((a,b)=>(a.exercise_order||0)-(b.exercise_order||0)).map(e=>`<div class="exercise" draggable="true" ondragstart="startDrag(event,'${e.id}')" ondragend="endDrag(event)" ondragover="allowDrop(event)" ondragleave="this.classList.remove('drop-target')" ondrop="dropExercise(event,'${e.id}')"><div style="flex:1"><strong>↕ ${esc(e.exercise_name)}</strong><small>${esc(e.muscle_group||'Gruppo non indicato')} · ${e.sets??'—'} serie · ${esc(e.reps||'—')} reps · ${e.rest_seconds??'—'}s recupero</small>${e.notes?`<div class="muted" style="margin-top:5px">${esc(e.notes)}</div>`:''}</div><div class="exercise-actions"><button class="btn ghost" onclick="moveExercise('${e.id}',-1)" title="Sposta su">↑</button><button class="btn ghost" onclick="moveExercise('${e.id}',1)" title="Sposta giù">↓</button><button class="btn secondary" onclick="editExercise('${e.id}')">Modifica</button><button class="btn danger" onclick="deleteExercise('${e.id}')">Elimina</button></div></div>`).join('')}</div>`).join(''):'<div class="empty">Nessun esercizio. Aggiungi il primo esercizio.</div>'}</div>`;return}if(tab==="history"){const plans=[...(currentClient.plans||[])].sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));el.innerHTML=`<div class="card"><div class="plan-toolbar"><div><h2>Storico schede</h2><p class="muted">Tutte le schede di ${esc(currentClient.full_name)}.</p></div><button class="btn primary" onclick="newPlan()">+ Nuova scheda</button></div>${plans.length?plans.map(p=>{const s=status(p);return `<div class="history-item"><div><div class="history-title">${esc(p.name)}</div><div class="muted">${dateIT(p.start_date)} → ${dateIT(p.end_date)} · <span class="badge ${s[0]}">${s[1]}</span></div></div><div class="actions" style="margin-top:0"><button class="btn secondary" onclick="openHistoricalPlan('${p.id}')">Apri</button><button class="btn ghost" onclick="duplicatePlan('${p.id}')">Duplica</button></div></div>`}).join(''):'<div class="empty">Nessuna scheda nello storico.</div>'}</div>`;return}el.innerHTML=`<div class="card"><h2>Progressi</h2><p class="muted">Questa sezione sarà collegata ai dati di peso, misure, carichi e grafici.</p><div class="empty">📊 Area progressi pronta per il prossimo modulo.</div></div>`}
function pText(p){return p?`${esc(p.name)} · ${dateIT(p.start_date)} → ${dateIT(p.end_date)}`:'Nessuna scheda assegnata.'}
function exerciseHtml(){if(!exercises.length)return `<div class="empty">Nessun esercizio nella scheda.<br><br><button class="btn primary" onclick="newExercise()">+ Aggiungi esercizio</button></div>`;return `<div class="head" style="margin:10px 0"><div><h3 style="margin:0">Esercizi</h3><p class="muted">${exercises.length} esercizi</p></div><button class="btn primary" onclick="newExercise()">+ Aggiungi esercizio</button></div>${exercises.map(e=>`<div class="exercise"><div><strong>${esc(e.exercise_name)}</strong><small>${esc(e.day_name||'Giorno')} · ${e.sets??'—'} serie · ${esc(e.reps||'—')} reps · ${e.rest_seconds??'—'}s recupero</small>${e.notes?`<div class="muted" style="margin-top:5px">${esc(e.notes)}</div>`:''}</div><button class="btn danger" onclick="deleteExercise('${e.id}')">Elimina</button></div>`).join('')}`}
function closeModal(){document.getElementById("modalRoot")?.remove()}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modalRoot"><div class="modal">${html}</div></div>`);const m=document.getElementById('modalRoot');m.addEventListener('click',e=>{if(e.target===m)closeModal()})}
function newClient(){modal(`<h2>Nuovo cliente</h2><p class="muted">Inserisci i dati del cliente.</p><div id="clientMsg"></div><div class="field"><label>Nome e cognome *</label><input id="clientName" class="input" autofocus></div><div class="field"><label>Email</label><input id="clientEmail" class="input" type="email"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn primary" id="saveClientBtn">Salva cliente</button></div>`);document.getElementById('saveClientBtn').onclick=()=>saveClient()}
function editClient(id){const c=clients.find(x=>x.id===id);if(!c)return;modal(`<h2>Modifica cliente</h2><div id="clientMsg"></div><div class="field"><label>Nome e cognome *</label><input id="clientName" class="input" value="${esc(c.full_name)}"></div><div class="field"><label>Email</label><input id="clientEmail" class="input" type="email" value="${esc(c.email||'')}"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn primary" id="saveClientBtn">Salva modifiche</button></div>`);document.getElementById('saveClientBtn').onclick=()=>saveClient(id)}
async function saveClient(id){const name=document.getElementById('clientName').value.trim(),email=document.getElementById('clientEmail').value.trim()||null,msg=document.getElementById('clientMsg'),btn=document.getElementById('saveClientBtn');if(!name){msg.innerHTML='<div class="err">Inserisci nome e cognome.</div>';return}btn.disabled=true;const r=id?await sb.from('clients').update({full_name:name,email}).eq('id',id):await sb.from('clients').insert({pt_id:session.user.id,full_name:name,email}).select().single();if(r.error){msg.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';btn.disabled=false;return}closeModal();await loadClients();if(id&&currentClient){currentClient=clients.find(c=>c.id===id)}if(currentClient)clientPage('profile');else dashboard()}
function newPlan(){planModal()}
function editPlan(id){planModal(id)}
function planModal(id){const p=id?(currentClient.plans||[]).find(x=>x.id===id):null;modal(`<h2>${p?'Modifica scheda':'Nuova scheda'}</h2><p class="muted">${esc(currentClient.full_name)}</p><div id="planMsg"></div><div class="modal-grid"><div class="field" style="grid-column:1/-1"><label>Nome scheda *</label><input id="planName" class="input" value="${esc(p?.name||'Scheda '+currentClient.full_name)}"></div><div class="field"><label>Data inizio *</label><input id="planStart" class="input" type="date" value="${p?.start_date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Data fine *</label><input id="planEnd" class="input" type="date" value="${p?.end_date||new Date(Date.now()+30*86400000).toISOString().slice(0,10)}"></div><div class="field" style="grid-column:1/-1"><label>Descrizione</label><textarea id="planDesc">${esc(p?.description||'')}</textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn primary" id="savePlanBtn">Salva scheda</button></div>`);document.getElementById('savePlanBtn').onclick=()=>savePlan(id)}
async function savePlan(id){const name=document.getElementById('planName').value.trim(),start=document.getElementById('planStart').value,end=document.getElementById('planEnd').value,description=document.getElementById('planDesc').value.trim()||null,msg=document.getElementById('planMsg'),btn=document.getElementById('savePlanBtn');if(!name||!start||!end||end<start){msg.innerHTML='<div class="err">Controlla nome e date.</div>';return}btn.disabled=true;const payload={client_id:currentClient.id,name,start_date:start,end_date:end,description};const r=id?await sb.from('plans').update(payload).eq('id',id):await sb.from('plans').insert(payload).select().single();if(r.error){msg.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';btn.disabled=false;return}closeModal();await loadClients();currentClient=clients.find(c=>c.id===currentClient.id);currentPlan=id?(currentClient.plans||[]).find(x=>x.id===id):r.data;await loadExercises();clientPage('plan')}
async function duplicatePlan(id){const source=(currentClient.plans||[]).find(x=>x.id===id);if(!source)return;const newStart=new Date().toISOString().slice(0,10),oldStart=new Date(source.start_date+"T00:00:00"),oldEnd=new Date(source.end_date+"T00:00:00"),duration=Math.max(1,Math.round((oldEnd-oldStart)/86400000)),newEnd=new Date(Date.now()+duration*86400000).toISOString().slice(0,10);modal(`<h2>Duplica scheda</h2><p class="muted">Copia di <b>${esc(source.name)}</b></p><div id="dupMsg"></div><div class="field"><label>Nome nuova scheda *</label><input id="dupName" class="input" value="${esc(source.name+" — Copia")}"></div><div class="modal-grid"><div class="field"><label>Data inizio</label><input id="dupStart" class="input" type="date" value="${newStart}"></div><div class="field"><label>Data fine</label><input id="dupEnd" class="input" type="date" value="${newEnd}"></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn primary" id="dupBtn">Duplica scheda</button></div>`);document.getElementById('dupBtn').onclick=async()=>{const btn=document.getElementById('dupBtn'),msg=document.getElementById('dupMsg'),name=document.getElementById('dupName').value.trim(),start=document.getElementById('dupStart').value,end=document.getElementById('dupEnd').value;if(!name||!start||!end||end<start){msg.innerHTML='<div class="err">Controlla nome e date.</div>';return}btn.disabled=true;const r=await sb.from('plans').insert({client_id:currentClient.id,name,start_date:start,end_date:end,description:source.description||null}).select().single();if(r.error){msg.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';btn.disabled=false;return}const ex=await sb.from('plan_exercises').select('*').eq('plan_id',source.id);if(ex.error){msg.innerHTML='<div class="err">Impossibile leggere gli esercizi: '+esc(ex.error.message)+'</div>';btn.disabled=false;return}if(ex.data?.length){const rows=ex.data.map(e=>{const x={...e};delete x.id;x.plan_id=r.data.id;delete x.created_at;return x});const er=await sb.from('plan_exercises').insert(rows);if(er.error){msg.innerHTML='<div class="err">Scheda creata, ma errore nella copia degli esercizi: '+esc(er.error.message)+'</div>';btn.disabled=false;return}}closeModal();await loadClients();currentClient=clients.find(c=>c.id===currentClient.id);currentPlan=r.data;await loadExercises();clientPage('plan')}}
async function openHistoricalPlan(id){currentPlan=(currentClient.plans||[]).find(x=>x.id===id)||null;await loadExercises();clientPage('plan')}
const exerciseLibrary=[
{name:"Panca piana bilanciere",muscle:"Petto"},{name:"Panca inclinata manubri",muscle:"Petto"},{name:"Chest press",muscle:"Petto"},{name:"Croci ai cavi",muscle:"Petto"},{name:"Lat machine",muscle:"Dorsali"},{name:"Rematore bilanciere",muscle:"Dorsali"},{name:"Pulley basso",muscle:"Dorsali"},{name:"Pullover ai cavi",muscle:"Dorsali"},{name:"Military press",muscle:"Spalle"},{name:"Alzate laterali manubri",muscle:"Spalle"},{name:"Reverse fly",muscle:"Deltoidi posteriori"},{name:"Curl bilanciere",muscle:"Bicipiti"},{name:"Curl manubri",muscle:"Bicipiti"},{name:"Push down cavi",muscle:"Tricipiti"},{name:"French press",muscle:"Tricipiti"},{name:"Squat bilanciere",muscle:"Quadricipiti"},{name:"Leg press",muscle:"Quadricipiti"},{name:"Leg extension",muscle:"Quadricipiti"},{name:"Leg curl",muscle:"Femorali"},{name:"Stacco rumeno",muscle:"Femorali/glutei"},{name:"Hip thrust",muscle:"Glutei"},{name:"Calf raise",muscle:"Polpacci"},{name:"Plank",muscle:"Addome"},{name:"Crunch ai cavi",muscle:"Addome"},{name:"Back extension",muscle:"Lombari"}
];
function startDrag(ev,id){ev.dataTransfer.setData('text/plain',id);ev.dataTransfer.effectAllowed='move';ev.currentTarget.classList.add('dragging')}
function endDrag(ev){ev.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))}
function allowDrop(ev){ev.preventDefault();ev.currentTarget.classList.add('drop-target')}
async function dropExercise(ev,targetId){ev.preventDefault();const sourceId=ev.dataTransfer.getData('text/plain');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(!sourceId||sourceId===targetId)return;const list=[...exercises].sort((a,b)=>(a.exercise_order||0)-(b.exercise_order||0));const from=list.findIndex(x=>String(x.id)===String(sourceId)),to=list.findIndex(x=>String(x.id)===String(targetId));if(from<0||to<0)return;const [item]=list.splice(from,1);list.splice(to,0,item);const updates=list.map((x,i)=>sb.from('plan_exercises').update({exercise_order:i+1}).eq('id',x.id));const results=await Promise.all(updates);const err=results.find(x=>x.error);if(err){alert('Non è stato possibile riordinare gli esercizi: '+err.error.message);return}await loadExercises();clientPage('plan')}
function exerciseForm(e){return `<div id="exerciseMsg"></div><div class="modal-grid"><div class="field" style="grid-column:1/-1"><label>Esercizio *</label><input id="exerciseName" class="input" list="exerciseLibrary" placeholder="Cerca o scrivi un esercizio" value="${esc(e?.exercise_name||'')}"><datalist id="exerciseLibrary">${exerciseLibrary.map(x=>`<option value="${esc(x.name)}" label="${esc(x.name+' — '+x.muscle)}"></option>`).join('')}</datalist><div class="muted" style="font-size:12px;margin-top:5px">Puoi scegliere dalla libreria oppure inserire un esercizio personalizzato.</div></div><div class="field"><label>Giorno</label><input id="exerciseDay" class="input" value="${esc(e?.day_name||'Giorno A')}"></div><div class="field"><label>Ordine</label><input id="exerciseOrder" class="input" type="number" value="${e?.exercise_order??exercises.length+1}"></div><div class="field"><label>Serie</label><input id="exerciseSets" class="input" type="number" value="${e?.sets??''}"></div><div class="field"><label>Ripetizioni</label><input id="exerciseReps" class="input" placeholder="8-10" value="${esc(e?.reps||'')}"></div><div class="field"><label>Recupero (secondi)</label><input id="exerciseRest" class="input" type="number" value="${e?.rest_seconds??''}"></div><div class="field"><label>Gruppo muscolare</label><input id="exerciseMuscle" class="input" value="${esc(e?.muscle_group||'')}"></div><div class="field" style="grid-column:1/-1"><label>Note</label><textarea id="exerciseNotes">${esc(e?.notes||'')}</textarea></div></div>`}
function wireExerciseSuggestions(){const input=document.getElementById('exerciseName'),muscle=document.getElementById('exerciseMuscle');if(!input||!muscle)return;input.addEventListener('input',()=>{const found=exerciseLibrary.find(x=>x.name.toLocaleLowerCase()===input.value.trim().toLocaleLowerCase());if(found)muscle.value=found.muscle})}
function newExercise(){modal(`<h2>Aggiungi esercizio</h2>${exerciseForm(null)}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn primary" id="saveExerciseBtn">Aggiungi</button></div>`);wireExerciseSuggestions();document.getElementById('saveExerciseBtn').onclick=()=>saveExercise()}
function editExercise(id){const e=exercises.find(x=>x.id===id);if(!e)return;modal(`<h2>Modifica esercizio</h2>${exerciseForm(e)}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn primary" id="saveExerciseBtn">Salva modifiche</button></div>`);wireExerciseSuggestions();document.getElementById('saveExerciseBtn').onclick=()=>saveExercise(id)}
async function saveExercise(id){const msg=document.getElementById('exerciseMsg'),btn=document.getElementById('saveExerciseBtn'),payload={plan_id:currentPlan.id,exercise_name:document.getElementById('exerciseName').value.trim(),day_name:document.getElementById('exerciseDay').value.trim()||'Giorno A',exercise_order:Number(document.getElementById('exerciseOrder').value)||1,sets:document.getElementById('exerciseSets').value?Number(document.getElementById('exerciseSets').value):null,reps:document.getElementById('exerciseReps').value.trim()||null,rest_seconds:document.getElementById('exerciseRest').value?Number(document.getElementById('exerciseRest').value):null,muscle_group:document.getElementById('exerciseMuscle').value.trim()||null,notes:document.getElementById('exerciseNotes').value.trim()||null};if(!payload.exercise_name){msg.innerHTML='<div class="err">Inserisci l’esercizio.</div>';return}btn.disabled=true;const r=id?await sb.from('plan_exercises').update(payload).eq('id',id):await sb.from('plan_exercises').insert(payload);if(r.error){msg.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';btn.disabled=false;return}closeModal();await loadExercises();clientPage('plan')}
async function moveExercise(id,delta){const list=[...exercises].sort((a,b)=>(a.exercise_order||0)-(b.exercise_order||0));const i=list.findIndex(x=>String(x.id)===String(id)),j=i+delta;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];for(let k=0;k<list.length;k++){const r=await sb.from('plan_exercises').update({exercise_order:k+1}).eq('id',list[k].id);if(r.error){alert('Errore nel riordino: '+r.error.message);return}}await loadExercises();clientPage('plan')}
async function deletePlan(id){if(!confirm('Eliminare definitivamente questa scheda e tutti i suoi esercizi?'))return;const r=await sb.from('plans').delete().eq('id',id);if(r.error){alert(r.error.message);return}await loadClients();currentClient=clients.find(c=>c.id===currentClient.id);currentPlan=null;exercises=[];clientPage('profile')}
async function deleteExercise(id){if(!confirm('Eliminare questo esercizio?'))return;const r=await sb.from('plan_exercises').delete().eq('id',id);if(r.error){alert(r.error.message);return}await loadExercises();clientPage('plan')}
Object.assign(window,{
  openClient, editClient, closeModal, newClient, saveClient, newPlan, editPlan,
  duplicatePlan, openHistoricalPlan, newExercise, editExercise, saveExercise, deleteExercise, deletePlan, startDrag, endDrag, allowDrop, dropExercise, moveExercise,
  clientPage, dashboard, clientsPage
});
start();
</script>
